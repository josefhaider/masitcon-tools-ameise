# masitcon Zeiterfassung (Ameise) - Produktions/Staging-Stack
# Nutzt externe Supabase-URL (Cloud oder selbst gehostet)
#
# Staging:    BUILD_MODE=staging docker compose -f scripts/docker-compose.yml up --build
# Produktion: docker compose -f scripts/docker-compose.yml up --build (default)
# Env-Dateien: .env.staging oder .env.production im Repo-Root

services:
  app:
    build:
      context: ..
      dockerfile: scripts/Dockerfile
      args:
        BUILD_MODE: ${BUILD_MODE:-production}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
