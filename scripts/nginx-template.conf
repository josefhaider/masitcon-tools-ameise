# masitcon Zeiterfassung (Ameise) – Nginx-Template
#
# NICHT direkt verwenden! deploy.sh generiert die fertige Konfiguration
# mit korrekter Domain und Ports unter:
#   /opt/projects/masitcon-tools-ameise/{env}/configs/nginx-{env}.conf
#
# Einbinden (deploy.sh gibt den exakten Befehl aus):
#   sudo ln -s /opt/projects/.../configs/nginx-production.conf \
#              /etc/nginx/sites-enabled/ameise-production.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Routing-Strategie: Eine Domain, pfadbasiertes Routing
#   DOMAIN              → App (Vite SPA, statische Dateien via serve)
#   DOMAIN/supabase/*   → Supabase API-Gateway (Kong)
#
# HTTPS: Zertifikat via Certbot holen:
#   sudo certbot --nginx -d DOMAIN
#
# VITE_SUPABASE_URL muss zur Build-Zeit auf ${PROTOCOL}://${DOMAIN}/supabase gesetzt sein.
# ─────────────────────────────────────────────────────────────────────────────

