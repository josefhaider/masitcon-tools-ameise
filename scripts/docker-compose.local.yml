# masitcon Zeiterfassung (Ameise) - Lokale Entwicklung
# Nur App-Container – Supabase läuft via CLI (supabase start)

services:
  app:
    build:
      context: .
      dockerfile: scripts/Dockerfile
      args:
        VITE_SUPABASE_URL: http://host.docker.internal:54331
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
