# masitcon Zeiterfassung (Ameise) – Caddy-Snippet (Template)
#
# NICHT direkt verwenden! deploy.sh generiert das fertige Snippet
# mit korrekter Domain und Ports unter:
#   /opt/projects/masitcon-tools-ameise/{env}/configs/caddy-snippet.conf
#
# Manuelle Nutzung (Domain und Ports ersetzen):
#   1. DOMAIN, APP_PORT, API_PORT ersetzen
#   2. sudo cp caddy-snippet.conf /etc/caddy/conf.d/ameise-production.conf
#   3. sudo systemctl reload caddy
#
# Routing-Strategie: Eine Domain, Pfad-basiertes Routing
#   DOMAIN              → App (Vite SPA, statische Dateien)
#   DOMAIN/supabase/*   → Supabase API-Gateway (Kong)
#
# VITE_SUPABASE_URL muss zur Build-Zeit auf ${PROTOCOL}://${DOMAIN}/supabase gesetzt sein.
# ─────────────────────────────────────────────────────────────────────────────

# DOMAIN {
#
#     # ── Supabase API (Kong) ──────────────────────────────────────
#     handle_path /supabase/* {
#         reverse_proxy 127.0.0.1:API_PORT
#     }
#
#     # ── App (Vite SPA) ───────────────────────────────────────────
#     handle {
#         reverse_proxy 127.0.0.1:APP_PORT
#     }
#
#     log {
#         output file /var/log/masitcon-tools-ameise/caddy-production.log
#         format json
#     }
# }
