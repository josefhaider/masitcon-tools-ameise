# masitcon Zeiterfassung (Ameise) - Caddy-Snippet
# In /etc/caddy/Caddyfile einfügen: sudo systemctl reload caddy
# Ersetze DOMAIN durch deine Domain (z.B. zeiterfassung.example.com)

DOMAIN {
    reverse_proxy 127.0.0.1:8080
    log {
        output file /var/log/masitcon-ameise/caddy-access.log
    }
}
